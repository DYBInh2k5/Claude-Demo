<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f4f4f5;
      color: #111;
    }
    .container {
      max-width: 720px;
      margin: auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 14px 36px rgba(0,0,0,0.08);
      padding: 24px;
    }
    textarea {
      width: 100%;
      height: 140px;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      resize: vertical;
      font-size: 16px;
    }
    button {
      margin-top: 12px;
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: default;
    }
    .response {
      margin-top: 18px;
      white-space: pre-wrap;
      background: #f8fafc;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Claude Demo</h1>
    <p>Nhập prompt của bạn và nhấn "Gửi" để gọi Claude API.</p>

    <textarea id="prompt" placeholder="Viết prompt ở đây..."></textarea>
    <button id="sendBtn">Gửi</button>

    <div id="result" class="response" style="display:none"></div>
  </div>

  <script>
    const promptInput = document.getElementById('prompt');
    const sendBtn = document.getElementById('sendBtn');
    const resultDiv = document.getElementById('result');

    sendBtn.addEventListener('click', async () => {
      const prompt = promptInput.value.trim();
      if (!prompt) return;

      sendBtn.disabled = true;
      resultDiv.style.display = 'block';
      resultDiv.textContent = 'Đang gửi prompt...';

      try {
        const res = await fetch('/api/message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Lỗi không xác định');
        resultDiv.textContent = data.answer;
      } catch (err) {
        resultDiv.textContent = 'Lỗi: ' + err.message;
      } finally {
        sendBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
